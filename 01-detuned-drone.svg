<text x="1075" y="632" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526b73">No envelope needed:</text>
<text x="1075" y="665" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526b73">hold the VCA open.</text>
<text x="60" y="827" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#087f83">KNOBS TO PLAY</text>
