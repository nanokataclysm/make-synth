<text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#183139">01 / Slow detuned drone</text>
<text x="60" y="104" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#526b73">Two close pitches, a dark filter, and a slow change in brightness.</text>
<text x="60" y="144" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">Modules: 2 VCOs • mixer • low-pass VCF • VCA with bias • LFO • attenuator • output</text>
