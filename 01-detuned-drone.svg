<text x="142" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">VCO 2 FINE</text>
<text x="142" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">beat speed</text>
<text x="82" y="961" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Start a few cents from VCO 1.</text>
<rect x="442" y="851" width="358" height="134" rx="10" fill="#f5f8f8"/>
<circle cx="486" cy="894" r="23" fill="white" stroke="#183139" stroke-width="2.5"/>
<path d="M486,894 L497,878" stroke="#183139" stroke-width="3"/>
<text x="524" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">FILTER CUTOFF</text>
<text x="524" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">dark ↔ bright</text>
<text x="464" y="961" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526b73">Sweep slowly around the base pitch.</text>
<rect x="824" y="851" width="358" height="134" rx="10" fill="#f5f8f8"/>
<circle cx="868" cy="894" r="23" fill="white" stroke="#183139" stroke-width="2.5"/>
<path d="M868,894 L879,878" stroke="#183139" stroke-width="3"/>
<text x="906" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">LFO DEPTH</text>
<text x="906" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">amount of movement</text>
<text x="846" y="961" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Small sweeps keep it calm.</text>
<rect x="1206" y="851" width="358" height="134" rx="10" fill="#f5f8f8"/>
<circle cx="1250" cy="894" r="23" fill="white" stroke="#183139" stroke-width="2.5"/>
<path d="M1250,894 L1261,878" stroke="#183139" stroke-width="3"/>
<text x="1288" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">RESONANCE</text>
<text x="1288" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">soft ↔ focused</text>
<text x="1228" y="961" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Begin low; add a little at a time.</text>
<text x="60" y="1024" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#183139">START: Match pitches, detune slightly, open the VCA, then add a little filter modulation.</text>
<text x="60" y="1062" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">0.05 Hz means one modulation cycle every 20 seconds. Saw waves make a brighter variation.</text>
<text x="60" y="1100" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Generic patch recipe • jack names and knob ranges vary by module • 2026-09-13 • see PATCH-GUIDE.md</text>
