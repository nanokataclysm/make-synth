<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f83"/></marker><marker id="cv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8256b3"/></marker></defs>
<text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#183139">03 / Slowly shifting metallic drone</text>
<text x="60" y="104" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#526b73">A sine oscillator modulates a second oscillator at audio rate; a slow LFO adds drift.</text>
<text x="60" y="144" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">Modules: 2 VCOs (carrier needs linear FM) • low-pass VCF • VCA with bias • LFO • 2 attenuators • output</text>
<polyline points="60,186 150,186" fill="none" stroke="#087f83" stroke-width="4" stroke-linejoin="round" marker-end="url(#audio)"/>
<text x="172" y="194" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#087f83">AUDIO / sound path</text>
<polyline points="490,186 580,186" fill="none" stroke="#8256b3" stroke-width="4" stroke-linejoin="round" stroke-dasharray="11 8" marker-end="url(#cv)"/>
<text x="603" y="194" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#8256b3">CV / modulation</text>
<text x="1010" y="194" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">Arrows point from output to input.</text>
<rect x="60" y="225" width="210" height="120" rx="12" fill="#faf7fd" stroke="#8256b3" stroke-width="2.5"/>
<text x="165.0" y="260" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183139">LFO</text>
<text x="165.0" y="289" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526b73">sine • ~0.03 Hz</text>
<circle cx="165.0" cy="345" r="6" fill="white" stroke="#8256b3" stroke-width="2.5"/>
<text x="165.0" y="332" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#8256b3">SINE OUT</text>
<rect x="60" y="390" width="210" height="115" rx="12" fill="#faf7fd" stroke="#8256b3" stroke-width="2.5"/>
<text x="165.0" y="435" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183139">DRIFT DEPTH</text>
<text x="165.0" y="464" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526b73">very small</text>
<circle cx="165.0" cy="390" r="6" fill="white" stroke="#8256b3" stroke-width="2.5"/>
<text x="165.0" y="407" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#8256b3">IN</text>
