<text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#183139">02 / Breathing noise</text>
<text x="60" y="104" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#526b73">Wind, surf, and airy swells from one noise source and one slow LFO.</text>
<text x="60" y="144" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">Modules: noise • band-pass VCF • VCA with bias • LFO • 2 attenuators + mult • optional reverb • output</text>
<polyline points="60,186 150,186" fill="none" stroke="#087f83" stroke-width="4" stroke-linejoin="round" marker-end="url(#audio)"/>
<text x="172" y="194" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#087f83">AUDIO / sound path</text>
