<text x="795.0" y="670" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#183139">VOLUME DEPTH</text>
<text x="795.0" y="699" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526b73">gentle swells</text>
<circle cx="690" cy="720.0" r="6" fill="white" stroke="#8256b3" stroke-width="2.5"/>
<text x="703" y="726.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#8256b3">IN</text>
