<text x="603" y="194" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#8256b3">CV / modulation</text>
<text x="1010" y="194" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">Arrows point from output to input.</text>
