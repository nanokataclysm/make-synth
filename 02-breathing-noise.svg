<polyline points="900,720.0 960,720 960,580 795,580 795.0,540" fill="none" stroke="#8256b3" stroke-width="4" stroke-linejoin="round" stroke-dasharray="11 8" marker-end="url(#cv)"/>
<text x="1040" y="641" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526b73">Split ONE LFO output.</text>
<text x="1040" y="677" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">Each depth knob controls a separate CV.</text>
<text x="1040" y="721" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">No reverb? Patch VCA → OUTPUT.</text>
<text x="60" y="827" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#087f83">KNOBS TO PLAY</text>
<rect x="60" y="851" width="358" height="134" rx="10" fill="#f5f8f8"/>
<circle cx="104" cy="894" r="23" fill="white" stroke="#183139" stroke-width="2.5"/>
<path d="M104,894 L115,878" stroke="#183139" stroke-width="3"/>
<text x="142" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">FILTER FREQ</text>
<text x="142" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">size of the wind</text>
<text x="82" y="961" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Low = muffled; high = airy.</text>
<rect x="442" y="851" width="358" height="134" rx="10" fill="#f5f8f8"/>
<circle cx="486" cy="894" r="23" fill="white" stroke="#183139" stroke-width="2.5"/>
<path d="M486,894 L497,878" stroke="#183139" stroke-width="3"/>
<text x="524" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">RESONANCE</text>
<text x="524" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">whistling detail</text>
<text x="464" y="961" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Stay below self-oscillation at first.</text>
<rect x="824" y="851" width="358" height="134" rx="10" fill="#f5f8f8"/>
<circle cx="868" cy="894" r="23" fill="white" stroke="#183139" stroke-width="2.5"/>
<path d="M868,894 L879,878" stroke="#183139" stroke-width="3"/>
<text x="906" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">LFO RATE</text>
<text x="906" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">breathing speed</text>
<text x="846" y="961" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Try 10–40 seconds per cycle.</text>
<rect x="1206" y="851" width="358" height="134" rx="10" fill="#f5f8f8"/>
<circle cx="1250" cy="894" r="23" fill="white" stroke="#183139" stroke-width="2.5"/>
<path d="M1250,894 L1261,878" stroke="#183139" stroke-width="3"/>
<text x="1288" y="889" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#183139">VOLUME DEPTH</text>
<text x="1288" y="920" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526b73">soft swell ↔ silence</text>
<text x="1228" y="961" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526b73">Keep some sound at the LFO trough.</text>
<text x="60" y="1024" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#183139">START: Noise into filter; low resonance. Add quiet VCA gain, then both LFO depth controls.</text>
<text x="60" y="1062" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526b73">A low-pass output also works. Increase VCA bias or reduce CV depth if the sound closes off too much.</text>
<text x="60" y="1100" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526b73">Generic patch recipe • jack names and knob ranges vary by module • 2026-09-13 • see PATCH-GUIDE.md</text>
</svg>
