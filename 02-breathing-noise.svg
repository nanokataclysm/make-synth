<text x="475.0" y="670" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#183139">FILTER DEPTH</text>
<text x="475.0" y="699" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526b73">small sweep</text>
<circle cx="370" cy="720.0" r="6" fill="white" stroke="#8256b3" stroke-width="2.5"/>
<text x="383" y="726.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#8256b3">IN</text>
<circle cx="580" cy="720.0" r="6" fill="white" stroke="#8256b3" stroke-width="2.5"/>
<text x="567" y="726.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#8256b3">OUT</text>
